add_item:
  description: "Add item to ICA shopping list"
  fields:
    list_id:
      description: "ID of the shopping list"
      example: "97c9c669-91fd-4b08-84de-de14314d44ge"
    text:
      description: "Item text to add, e.g. 'kaffe'"
      example: "kaffe"

refresh:
  description: "Sync the ICA shopping list with the configured todo list in both directions"

clear_checked:
  description: "Sync, then delete checked-off rows from the ICA list and completed items from the to-do list"

get_offers:
  description: "Return the favourite store's current offers and the bonus balance"
  fields: {}

plan_dinners:
  fields:
    count:
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
    source:
      default: random
      selector:
        select:
          translation_key: plan_dinners_source
          options:
            - random
            - favorites
    list:
      example: "Veckans middagar"
      selector:
        text:
    calendar:
      selector:
        entity:
          domain: calendar
    start_date:
      selector:
        date:
    preview:
      default: false
      selector:
        boolean:
    add_to_list:
      description: "Add the ingredients to the shopping list."
      default: true
      selector:
        boolean:
    recipes:
      description: "Recipe ids to use, e.g. '123,456'. Overrides count and source."
      example: "123,456"
      selector:
        text:
    avoid_days:
      description: "Skip recipes eaten within this many days."
      example: 14
      default: 0
      selector:
        number:
          min: 0
          max: 365
          mode: box

search_recipes:
  description: "Search ICA's recipes. Each result's id works in plan_dinners' recipes."
  fields:
    query:
      description: "What to search for"
      example: "lasagne"
      required: true
      selector:
        text:
    limit:
      description: "How many recipes to return (1–30)"
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: box

add_dinner:
  description: "Save a dinner of your own, without an ICA recipe"
  fields:
    title:
      description: "What you're having"
      example: "Mormors kålpudding"
      required: true
      selector:
        text:
    date:
      description: "The day of the dinner"
      required: true
      selector:
        date:
    note:
      description: "Optional note, shown in the calendar event"
      example: "Dubbel sats, frys hälften"
      selector:
        text:
          multiline: true
    url:
      description: "Optional link to a recipe"
      example: "https://www.koket.se/kalpudding"
      selector:
        text:
          type: url

get_memory:
  description: "Return the saved dinner history and preferences"
  fields: {}

set_preference:
  description: "Remember a dinner preference, e.g. 'Oskar: ingen fisk'"
  fields:
    text:
      description: "The preference to remember"
      example: "Oskar: ingen fisk"
      required: true
      selector:
        text:

remove_preference:
  description: "Forget a saved preference (matched on the text)"
  fields:
    text:
      description: "The preference to remove"
      example: "ingen fisk"
      required: true
      selector:
        text:

forget_dinner:
  description: "Remove a dinner from the memory history"
  fields:
    recipe:
      description: "Recipe id, or part of the title"
      example: "719907"
      selector:
        text:
    date:
      description: "Only remove meals eaten on this date (YYYY-MM-DD)"
      example: "2026-10-16"
      selector:
        text:

clear_memory:
  description: "Empty the dinner memory (history and/or preferences)"
  fields:
    history:
      description: "Clear the dinner history"
      default: true
      selector:
        boolean:
    preferences:
      description: "Clear the saved preferences"
      default: true
      selector:
        boolean:
