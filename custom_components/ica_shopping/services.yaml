add_item:
  description: "Add item to ICA shopping list"
  fields:
    list_id:
      description: "ID of the shopping list"
      example: "97c9c669-91fd-4b08-84de-de14314d44ge"
    text:
      description: "Item text to add, e.g. 'kaffe'"
      example: "kaffe"

refresh:
  description: "Sync the ICA shopping list with the configured todo list in both directions"

clear_checked:
  description: "Sync, then delete checked-off rows from the ICA list and completed items from the to-do list"

get_offers:
  description: "Return the favourite store's current offers and the bonus balance"
  fields: {}

plan_dinners:
  fields:
    count:
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
    source:
      default: random
      selector:
        select:
          translation_key: plan_dinners_source
          options:
            - random
            - favorites
    list:
      example: "Veckans middagar"
      selector:
        text:
    calendar:
      selector:
        entity:
          domain: calendar
    start_date:
      selector:
        date:
    preview:
      default: false
      selector:
        boolean:
    add_to_list:
      description: "Add the ingredients to the shopping list."
      default: true
      selector:
        boolean:
    match_products:
      description: "Swap amounts like '3 dl grädde', '2 msk tomatpuré' or '1 gul lök' for an ICA product and package count."
      default: false
      selector:
        boolean:
    recipes:
      description: "Recipe ids to use, e.g. '123,456'. Overrides count and source."
      example: "123,456"
      selector:
        text:
    avoid_days:
      description: "Skip recipes eaten within this many days."
      example: 14
      default: 0
      selector:
        number:
          min: 0
          max: 365
          mode: box

search_recipes:
  description: "Search ICA's recipes. Each result's id works in plan_dinners' recipes."
  fields:
    query:
      description: "What to search for"
      example: "lasagne"
      required: true
      selector:
        text:
    limit:
      description: "How many recipes to return (1–30)"
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: box

get_favorites:
  description: "The ids of the recipes saved as favorites in the ICA app"

add_favorite:
  description: "Save an ICA recipe as a favorite, as the heart in the ICA app does"
  fields:
    recipe:
      description: "ICA recipe id"
      example: "719659"
      required: true
      selector:
        text:

remove_favorite:
  description: "Remove an ICA recipe from the favorites"
  fields:
    recipe:
      description: "ICA recipe id"
      example: "719659"
      required: true
      selector:
        text:

add_dinner:
  description: "Save a dinner of your own, without an ICA recipe"
  fields:
    title:
      description: "What you're having"
      example: "Mormors kålpudding"
      required: true
      selector:
        text:
    date:
      description: "The day of the dinner"
      required: true
      selector:
        date:
    note:
      description: "Optional note, shown in the calendar event"
      example: "Dubbel sats, frys hälften"
      selector:
        text:
          multiline: true
    url:
      description: "Optional link to a recipe"
      example: "https://www.koket.se/kalpudding"
      selector:
        text:
          type: url

get_memory:
  description: "Return the saved dinner history and preferences"
  fields: {}

set_preference:
  description: "Remember a dinner preference, e.g. 'Oskar: ingen fisk'"
  fields:
    text:
      description: "The preference to remember"
      example: "Oskar: ingen fisk"
      required: true
      selector:
        text:

remove_preference:
  description: "Forget a saved preference (matched on the text)"
  fields:
    text:
      description: "The preference to remove"
      example: "ingen fisk"
      required: true
      selector:
        text:

forget_dinner:
  description: "Remove a dinner from the memory history"
  fields:
    recipe:
      description: "Recipe id, or part of the title"
      example: "719907"
      selector:
        text:
    date:
      description: "Only remove meals eaten on this date (YYYY-MM-DD)"
      example: "2026-10-16"
      selector:
        text:

set_food_rule:
  description: "Remember an ingredient to avoid. omit: dishes built around it are passed by, and it is left out of the rest. never: every recipe with it is passed by."
  fields:
    ingredient:
      description: "The ingredient"
      example: "lök"
      required: true
      selector:
        text:
    level:
      description: "omit (Hellre utan) or never (Aldrig)"
      default: omit
      selector:
        select:
          options:
            - omit
            - never
          translation_key: food_rule_level
    terms:
      description: "Word stems that count, comma-separated (default: the ingredient)"
      example: "räk"
      selector:
        text:
    except:
      description: "Words that contain a term but are something else, comma-separated"
      example: "vitlök, gräslök, purjolök"
      selector:
        text:

remove_food_rule:
  description: "Forget the food rule for an ingredient"
  fields:
    ingredient:
      description: "The ingredient"
      example: "lök"
      required: true
      selector:
        text:

set_recipe_variant:
  description: "Save the household's own version of an ICA recipe: lines it leaves out and lines it adds"
  fields:
    recipe:
      description: "ICA recipe id"
      example: "720707"
      required: true
      selector:
        text:
    omit:
      description: "Ingredient lines to leave out, one per line"
      example: "1 gul lök"
      selector:
        text:
          multiline: true
    add:
      description: "Lines to add, one per line"
      example: "2 morötter, rivna"
      selector:
        text:
          multiline: true
    note:
      description: "A short note"
      selector:
        text:
    title:
      description: "The recipe's title, when it isn't in the dinner memory"
      selector:
        text:

remove_recipe_variant:
  description: "Go back to ICA's own recipe"
  fields:
    recipe:
      description: "ICA recipe id"
      example: "720707"
      required: true
      selector:
        text:

clear_memory:
  description: "Empty the dinner memory (history and/or preferences)"
  fields:
    history:
      description: "Clear the dinner history"
      default: true
      selector:
        boolean:
    preferences:
      description: "Clear the saved preferences"
      default: true
      selector:
        boolean:
